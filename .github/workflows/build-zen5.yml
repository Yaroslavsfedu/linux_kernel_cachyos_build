# ============================================================================
# Сборка ядра linux-cachyos под AMD Ryzen 5 9600X (Zen 5 / znver5) на GitHub Actions.
#
# CPU сборочного раннера НЕ используется для автоопределения: NATIVE запрещён,
# жёстко ставится _processor_opt=zen5 (CONFIG_MZEN5 -> -march=znver5).
#
# Автономная схема:
#   этот репозиторий  = только сборщик (workflow, zen5-patches.sh);
#   PKGBUILD + config = клонируются из форка Yaroslavsfedu/linux-cachyos;
#   tarball исходников= из релиза того же форка (зеркало CachyOS/linux;
#                       создать/обновить: ./mirror-release.sh cachyos-X.Y.Z-N в форке).
#
# Результат: артефакт *.pkg.tar.zst -> sudo pacman -U ...
# ============================================================================
name: Build CachyOS kernel (Zen 5 / Ryzen 5 9600X)

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      variant:
        description: 'Вариант ядра (папка в форке Yaroslavsfedu/linux-cachyos)'
        required: true
        default: 'linux-cachyos'
        type: choice
        options: [linux-cachyos, linux-cachyos-bore, linux-cachyos-eevdf, linux-cachyos-bmq, linux-cachyos-hardened, linux-cachyos-lts, linux-cachyos-rc, linux-cachyos-rt-bore, linux-cachyos-server, linux-cachyos-deckify]
      processor_opt:
        description: 'Оптимизация компилятора под CPU'
        required: true
        default: 'zen5'
        type: choice
        options: [zen5, zen4, GENERIC_V4, GENERIC_V3, generic]
      llvm_lto:
        description: 'LLVM LTO режим'
        required: true
        default: 'thin'
        type: choice
        options: [thin, full, none]
      cpusched:
        description: 'CPU-планировщик'
        required: true
        default: 'cachyos'
        type: choice
        options: [cachyos, bore, eevdf, bmq]
      hz:
        description: 'Tick rate (HZ)'
        required: true
        default: '1000'
        type: choice
        options: ['1000', '750', '600', '500', '300', '250', '100']
env:
  CCACHE_DIR: /home/builder/.ccache
  PKGS_REPO: https://github.com/Yaroslavsfedu/linux-cachyos.git

jobs:
  build:
    name: ${{ inputs.variant || 'linux-cachyos' }} (${{ inputs.processor_opt || 'zen5' }})
    runs-on: ubuntu-24.04
    container:
      image: archlinux/archlinux:base-devel
    steps:
      - name: Checkout (этот репозиторий сборщика)
        uses: actions/checkout@v4

      # Чистит хостовую VM раннера (тулчейны .NET/Android/GHC, образы в /mnt,
      # docker-образы, apt-кэш): +~25 ГБ под сборку с ThinLTO. Требует sudo+docker
      # на хосте, поэтому run-обёртка; не валит сборку никогда.
      - name: Maximize build disk space
        continue-on-error: true
        run: |
          echo "=== Disk BEFORE ==="; df -h / /mnt 2>/dev/null || true
          set +e
          sudo rm -rf /mnt/image* /mnt/data* 2>/dev/null
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache/CodeQL /usr/local/share/powershell 2>/dev/null
          sudo docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null \
            | grep -v '^archlinux/archlinux' | while read img; do sudo docker rmi -f "$img" 2>/dev/null; done
          sudo docker builder prune -af 2>/dev/null
          sudo rm -rf /var/lib/apt/lists/* /usr/share/man /usr/share/doc 2>/dev/null
          set -e
          echo "=== Disk AFTER ==="; df -h / /mnt 2>/dev/null || true

      - name: Setup build environment (Arch + CachyOS repo, ccache, builder user)
        run: |
          cat << 'EOF' >> /etc/pacman.conf
          [cachyos]
          Server = https://mirror.cachyos.org/repo/x86_64/cachyos
          EOF

          pacman-key --init
          pacman-key --populate archlinux
          # Ключ репозитория CachyOS (pacman -Syu) + ключи мейнтейнеров ядра,
          # которыми подписан tar.gz (validpgpkeys PKGBUILD).
          for KEY in F3B607488DB35A47 \
                     E18447AC260021D31F3FF6C4C8A2A4774B8B63C4 \
                     E8B9AA39F054E30E8290D492C3C4820857F654FE; do
            pacman-key --recv-keys "$KEY" --keyserver hkps://keys.openpgp.org || true
            pacman-key --lsign-key "$KEY" || true
          done

          pacman -Syu --noconfirm --needed git ccache clang llvm lld sudo base-devel

          useradd builder -m -G wheel
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chmod -R a+rw .

          sed -i 's/#MAKEFLAGS="-j2"/MAKEFLAGS="-j$(nproc) -l$(nproc)"/g' /etc/makepkg.conf
          sed -i 's|#PACKAGER=".*"|PACKAGER="GitHub Actions (Zen5 CI) \<zen5ci@users.noreply.github.com\>"|g' /etc/makepkg.conf
          sed -i 's|!ccache|ccache|' /etc/makepkg.conf
          install -d -m 777 "$CCACHE_DIR"

      # makepkg проверяет подписи исходников от имени builder, а не root —
      # ключи из pacman-key в его keyring не видны.
      - name: Import maintainer PGP keys into builder keyring
        run: |
          sudo -u builder mkdir -p /home/builder/.gnupg && sudo chmod 700 /home/builder/.gnupg
          for KEY in E18447AC260021D31F3FF6C4C8A2A4774B8B63C4 \
                     E8B9AA39F054E30E8290D492C3C4820857F654FE; do
            sudo -u builder gpg --homedir /home/builder/.gnupg \
                --keyserver hkps://keys.openpgp.org --recv-keys "$KEY" || true
          done
          sudo -u builder gpg --homedir /home/builder/.gnupg --list-keys || true

      - name: Checkout kernel PKGBUILDs (форк Yaroslavsfedu/linux-cachyos)
        run: |
          git clone --depth 1 "$PKGS_REPO" pkgs
          # клон идёт от root, а makepkg пишет от builder — открыть права
          chmod -R a+rwX pkgs
          variant="${{ inputs.variant || 'linux-cachyos' }}"
          if [ ! -f "pkgs/$variant/PKGBUILD" ]; then
            echo "::error::В форке нет варианта pkgs/$variant (репо $PKGS_REPO)"
            ls pkgs
            exit 1
          fi
          echo "== PKGBUILD: $variant =="

      - name: Patch PKGBUILDs for Zen 5 (znver5) support
        run: |
          chmod +x zen5-patches.sh
          ./zen5-patches.sh pkgs

      # Источники ядра: сначала релиз форка, если тарбалла там ещё нет —
      # релиз CachyOS/linux под ВЕРСИЮ PKGBUILD (тег _srcname), а не "последний какой есть".
      - name: Kernel source URL check (fork release -> CachyOS fallback)
        run: |
          dir="pkgs/${{ inputs.variant || 'linux-cachyos' }}"
          cd "$dir"
          srcname="$( (source ./PKGBUILD 2>/dev/null; printf '%s' "${_srcname:-}") )"
          test -n "$srcname" || { echo "::error::не удалось определить _srcname из PKGBUILD"; exit 1; }

          mine="https://github.com/Yaroslavsfedu/linux-cachyos/releases/download/${srcname}/${srcname}.tar.gz"
          if curl -fsIL --max-time 30 "$mine" > /dev/null 2>&1; then
            echo "OK: релиз форка содержит исходники ${srcname}"
          else
            echo "::warning::релиз форка с ${srcname} не найден — fallback на CachyOS/linux"
            sed -i 's|https://github.com/Yaroslavsfedu/linux-cachyos/releases/download|https://github.com/CachyOS/linux/releases/download|' PKGBUILD
            grep -n 'releases/download' PKGBUILD
          fi

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.variant || 'linux-cachyos' }}-${{ inputs.llvm_lto || 'thin' }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.variant || 'linux-cachyos' }}-${{ inputs.llvm_lto || 'thin' }}

      # КЛЮЧЕВОЕ: целевой CPU = Zen 5 (CONFIG_MZEN5 -> -march=znver5), а не CPU раннера
      - name: Build kernel package (optimized for Ryzen 5 9600X / znver5)
        env:
          _processor_opt: ${{ inputs.processor_opt || 'zen5' }}
          _cachy_config: yes
          _cpusched: ${{ inputs.cpusched || 'cachyos' }}
          _use_llvm_lto: ${{ inputs.llvm_lto || 'thin' }}
          _cc_harder: yes
          _HZ_ticks: ${{ inputs.hz || '1000' }}
          _tickrate: full
          _preempt: full
          _hugepage: always
          _per_gov: no
          _tcp_bbr3: no
          _build_zfs: no
          _build_nvidia_open: no
          _localmodcfg: no
          _use_current: no
        run: |
          cd "pkgs/${{ inputs.variant || 'linux-cachyos' }}"
          sudo -H -E -u builder makepkg --skipchecksums --syncdeps --noconfirm

      # PKGBUILD (форк) кладёт итоговый .config в usr/lib/modules/<ver>/config;
      # извлекаем его точным путём (без --wildcards — падал на реальном пакете)
      # и проверяем, что ядро собрано под znver5, а не под -Os/generic/native.
      - name: Verify the produced kernel really targets znver5
        run: |
          set -euo pipefail
          dir="pkgs/${{ inputs.variant || 'linux-cachyos' }}"
          pkg=$(ls "$dir"/linux-*.pkg.tar.zst | head -1)
          echo "Inspecting $pkg"
          tar -xOf "$pkg" '.PKGINFO' || true

          work=$(mktemp -d)
          tar -tzf "$pkg" > "$work/filelist.txt" 2>/dev/null || \
            bsdtar -tf "$pkg" > "$work/filelist.txt"
          cfgpath=$(grep -E '(^|/)modules/[^/]+/config$' "$work/filelist.txt" \
                    | grep -v '\.old$' | head -1 || true)
          if [ -n "$cfgpath" ]; then
            echo "Kernel config inside package: $cfgpath"
            tar -xOf "$pkg" "$cfgpath" > "$work/kconfig" 2>/dev/null || \
              bsdtar -xOf "$pkg" "$cfgpath" > "$work/kconfig" || true
          fi
          # Резерв: .config этой же сборки из srcdir (после makepkg сохраняется)
          if [ ! -s "$work/kconfig" ]; then
            srccfg=$(find "$dir" -maxdepth 3 -path '*/src/*/.config' -print -quit || true)
            if [ -n "$srccfg" ]; then
              echo "::warning::config отсутствует в пакете — беру .config из srcdir: $srccfg"
              cp "$srccfg" "$work/kconfig"
            fi
          fi
          test -s "$work/kconfig" || {
            echo "::error::kernel config не найден ни в пакете, ни в srcdir; sample file list:"
            grep -E 'modules/' "$work/filelist.txt" | head -30 || true
            exit 1
          }

          echo "--- CPU tuning options in the built kernel config ---"
          grep -E '^CONFIG_(MZEN5|MZEN4|MZEN3|MZEN2|MK8|MCORE2|MATOM|MPSC|MARCH_ZNN4_VPCZ1|MVISASTEREX|MNOAVI|MCORE_AVX_NO_2|MPENTIUM_M|MPENTUM_4|MPENTPRO|MFATHOME|MX86_64|GENERIC_CPU|NATIVE_CPU64|X86_NATIVE_CPU|CC_OPTIMIZE_FOR_SIZE|CC_OPTIMIZE_FOR_PERFORMANCE|CC_OPTIMIZE_FOR_PERFORMANCE_O3)=' "$work/kconfig" || true

          if grep -q '^CONFIG_MZEN5=y' "$work/kconfig"; then
            echo "OK: kernel is built for Zen 5 (CONFIG_MZEN5=y -> -march=znver5 -mtune=znver5)"
          else
            echo "::error::CONFIG_MZEN5=y not found! The package was NOT optimized for Ryzen 5 9600X."
            exit 1
          fi

          if grep -q '^CONFIG_CC_OPTIMIZE_FOR_SIZE=y' "$work/kconfig"; then
            echo "::error::Kernel was built with -Os (size optimization) - CI fallback kicked in, perf flags lost!"
            exit 1
          fi

          if grep -qE '^CONFIG_(X86_NATIVE_CPU|NATIVE_CPU64)=y' "$work/kconfig"; then
            echo "::warning::Native-CPU tuning detected - the kernel may be tuned for the RUNNER's CPU, not yours!"
          elif grep -q '^CONFIG_GENERIC_CPU=y' "$work/kconfig"; then
            echo "::warning::Generic x86-64 tuning detected instead of znver5!"
          fi

          if grep -q '^CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y' "$work/kconfig"; then
            echo "OK: -O3 optimization confirmed"
          elif grep -q '^CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y' "$work/kconfig"; then
            echo "NOTE: standard -O2 optimization (expected for full/autofdo variants)"
          fi

          rm -rf "$work"

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-cachyos-zen5-${{ inputs.llvm_lto || 'thin' }}
          path: |
            pkgs/${{ inputs.variant || 'linux-cachyos' }}/*.pkg.tar.zst
            pkgs/${{ inputs.variant || 'linux-cachyos' }}/*.pkg.tar.zst.sig
          if-no-files-found: error
          retention-days: 14
